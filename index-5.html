<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Pastelera Ultimate v9 - ERP Bodega</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #FFF5F6; color: #2D2D2D; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-bottom: 30px; -webkit-text-size-adjust: 100%; }
        
        .container { background: #FFFFFF; border: 1px solid #F0A6CA; border-radius: 20px; padding: 15px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(233, 30, 99, 0.05); }
        h1 { color: #E91E63; font-size: 1.15rem; text-align: center; margin-bottom: 18px; line-height: 1.4; font-weight: 700; }
        
        /* 5 Tabs Ajustados para Móvil */
        .tabs { display: flex; gap: 2px; margin-bottom: 20px; background: #FFE5EC; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px 1px; font-size: 0.72rem; font-weight: bold; border: none; border-radius: 9px; background: transparent; color: #2D2D2D; cursor: pointer; transition: all 0.2s ease; text-align: center; -webkit-tap-highlight-color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-btn.active { background: #FFFFFF; color: #E91E63; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        
        .section { display: none; }
        .section.active { display: block; }

        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #4A4A4A; }
        input, select, textarea { width: 100%; padding: 10px; font-size: 0.95rem; border: 1.5px solid #E2E8F0; border-radius: 10px; background-color: #FFFFFF; color: #000000; outline: none; -webkit-appearance: none; }
        input:focus, select:focus, textarea:focus { border-color: #F0A6CA; }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        
        button.action-btn { width: 100%; padding: 12px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; margin-top: 5px; -webkit-tap-highlight-color: transparent; }
        .btn-calc { background-color: #94D2BD; color: #2D2D2D; }
        .btn-calc:active { background-color: #7fc2ad; }
        .btn-save { background-color: #F0A6CA; color: #2D2D2D; }
        .btn-save:active { background-color: #e295b9; }
        .btn-deduct { background-color: #FFB5A7; color: #2D2D2D; margin-top: 10px; border: 1px solid #F0A6CA; }
        .btn-deduct:active { background-color: #fca395; }

        .list-container { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; max-height: 380px; overflow-y: auto; padding: 5px; margin-bottom: 15px; }
        
        .recipe-accordion { margin-bottom: 8px; border: 1px solid #FFF0F2; border-radius: 10px; overflow: hidden; }
        .recipe-header { background: #fff; padding: 12px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .recipe-header.active { border-bottom: 1px solid #FFE5EC; background-color: #FFF9FA; }
        .recipe-header span { font-size: 0.85rem; font-weight: 600; }
        .recipe-header .cost-badge { color: #E91E63; font-weight: 700; font-size: 0.85rem; }
        
        .recipe-details { display: none; background: #FFFBFC; padding: 12px; animation: slideDown 0.2s ease-out; }
        .recipe-details.show { display: block; }
        .ingredient-row { font-size: 0.8rem; padding: 7px 0; border-bottom: 1px solid #fdf0f3; color: #555; display: flex; justify-content: space-between; align-items: center; }
        
        .steps-box { background: #FFFFFF; border: 1px solid #FFE5EC; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.8rem; color: #4A4A4A; white-space: pre-wrap; line-height: 1.4; }
        
        .recipe-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px dashed #FFE5EC; padding-top: 10px; }
        .btn-inline { flex: 1; padding: 8px; font-size: 0.75rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
        .btn-edit { background-color: #E0F2F1; color: #00796B; }
        .btn-delete { background-color: #FFEBEE; color: #C62828; }

        .temp-ingredients { background: #F7F9FA; border: 1px dashed #F0A6CA; border-radius: 10px; padding: 10px; margin-bottom: 15px; font-size: 0.8rem; }
        .temp-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 4px; border-bottom: 1px solid #EDF2F7; }
        .temp-row:last-child { border-bottom: none; }
        .btn-remove-ing { background: #FFEBEE; color: #D32F2F; border: none; padding: 4px 8px; font-size: 0.7rem; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* Estilos Bodega vs Stock */
        .stock-row { font-size: 0.8rem; padding: 10px 6px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 4px; }
        .stock-row-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .stock-row-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 0.72rem; color: #666; background-color: #FAFAFA; padding: 4px; border-radius: 6px; }
        .stock-alert { background-color: #FFEBEE; border: 1px dashed #D32F2F; border-radius: 8px; }
        .stock-alert .stock-name { color: #C62828 !important; font-weight: bold !important; }

        .results { background-color: #FFE5EC; border: 1px solid #F0A6CA; border-radius: 14px; padding: 14px; text-align: center; margin-top: 15px; }
        .res-price { font-size: 1.3rem; font-weight: 800; color: #C9184A; }

        .backup-panel { border-top: 1px solid #E2E8F0; margin-top: 25px; padding-top: 15px; }
        .backup-title { font-size: 0.8rem; font-weight: 700; color: #777; text-transform: uppercase; margin-bottom: 8px; }
        .backup-buttons { display: flex; gap: 8px; }
        .btn-backup { flex: 1; padding: 10px; font-size: 0.75rem; font-weight: bold; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer; color: #475569; text-align: center; }
        
        .edit-indicator { background: #FFF3CD; border: 1px solid #FFEBA2; color: #856404; padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn-cancel-edit { background: none; border: none; color: #A52A2A; font-weight: bold; cursor: pointer; text-decoration: underline; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainGreeting">¿Qué deseas calcular hoy amorcito?<br>¿Qué cosa rica vas a cocinar? 👩🏻‍🍳❤️</h1>
        
        <div class="tabs">
            <button id="tab-calc" class="tab-btn active" onclick="switchTab('calc')">🧮 Calc</button>
            <button id="tab-lista" class="tab-btn" onclick="switchTab('lista')">📖 Recetas</button>
            <button id="tab-crear" class="tab-btn" onclick="switchTab('crear')">🍰 +Crear</button>
            <button id="tab-stock" class="tab-btn" onclick="switchTab('stock')">🛒 Stock</button>
            <button id="tab-bodega" class="tab-btn" onclick="switchTab('bodega')">📦 Bodega</button>
        </div>
        
        <!-- SECCIÓN 1: CALCULAR -->
        <div id="sec-calc" class="section active">
            <label>1. Código ID del dulce:</label>
            <input type="number" id="calcId" pattern="[0-9]*" inputmode="numeric" placeholder="Ej: 101" style="margin-bottom:15px">
            <label>2. ¿Cuántas unidades salieron?:</label>
            <input type="number" id="calcCantidad" pattern="[0-9]*" inputmode="numeric" placeholder="Ej: 12">
            <button class="action-btn btn-calc" onclick="calcularPrecio()">💰 CALCULAR PRECIO DE VENTA</button>
            
            <div class="results">
                <div id="resProd" style="font-weight:700; font-size: 0.95rem;">Preparación: ---</div>
                <div id="resCost" style="font-size:0.85rem; color:#555">Costo Unitario Real: $0 CLP</div>
                <div class="res-price" id="resVenta" style="margin-bottom: 5px;">VENDER A (+60%): $0 CLP</div>
                
                <div id="deductStockPanel" style="display:none; margin-top:12px; border-top:1px dashed #F0A6CA; padding-top:10px;">
                    <button class="action-btn btn-deduct" onclick="ejecutarDescuentoInsumos()" style="font-size:0.85rem;">👩🏻‍🍳 REGISTRAR EN COCINA Y DESCONTAR INSUMOS</button>
                </div>
            </div>
        </div>
        
        <!-- SECCIÓN 2: LISTA DE RECETAS -->
        <div id="sec-lista" class="section">
            <label style="margin-bottom:10px">Toca una receta para ver sus ingredientes y paso a paso:</label>
            <div class="list-container" id="listaProductosContainer"></div>
        </div>
        
        <!-- SECCIÓN 3: CREAR O EDITAR -->
        <div id="sec-crear" class="section">
            <div id="editIndicatorPanel" class="edit-indicator" style="display:none;">
                <span>✏️ Modo Edición Activo</span>
                <button class="btn-cancel-edit" onclick="cancelarEdicion()">Cancelar</button>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div style="flex:2"><label>Nombre Receta:</label><input type="text" id="newRecetaNombre" placeholder="Ej: Alfajor Maicena"></div>
                <div style="flex:1"><label>ID Receta:</label><input type="text" id="newRecetaId" readonly style="background:#f9f9f9; color:#E91E63; font-weight:bold; text-align:center;"></div>
            </div>
            
            <div style="margin-bottom:15px;">
                <label>Paso a Paso / Instrucciones de preparación:</label>
                <textarea id="newRecetaPasos" placeholder="Ej: 1. Echar chips encima para decorar.&#10;2. Echar chips derretidos dentro..."></textarea>
            </div>

            <div style="border-top:1px solid #eee; margin:15px 0; padding-top:10px">
                <label style="color:#E91E63;">Vincular Insumo a la Fórmula:</label>
                <select id="recetaSelectInsumo" style="margin-bottom:10px"></select>
                <input type="number" id="recetaCantInsumo" placeholder="Cantidad usada (gr/ml/un)">
                <button class="action-btn" style="background:#E2E8F0; color:#2D2D2D; font-size:0.8rem; margin-top:10px;" onclick="agregarIngredienteATemp()">➕ Vincular Insumo a la Mezcla</button>
            </div>
            
            <label style="margin-top:10px;">Materiales agregados (Admite duplicados separados):</label>
            <div class="temp-ingredients" id="tempIngredientsList">Aún no hay ingredientes...</div>
            <button class="action-btn btn-save" id="btnGuardarReceta" onclick="guardarNuevaReceta()">💾 GUARDAR RECETA COMPLETA</button>
        </div>
        
        <!-- SECCIÓN 4: STOCK (CLÁSICO - INGRESOS/COMPRAS) -->
        <div id="sec-stock" class="section">
            <div style="display:flex; gap:10px; margin-bottom:15px; font-weight:bold; font-size:0.85rem;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="radio" name="stockM" value="update" checked onchange="altStock()" style="width:auto;"> Reestock / Editar</label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="radio" name="stockM" value="new" onchange="altStock()" style="width:auto;"> Nuevo Material</label>
            </div>
            <div id="g-update"><label>Selecciona Insumo a reabastecer:</label><select id="stockSelectInsumo" onchange="cStock()"></select></div>
            <div id="g-new" style="display:none"><label>Nombre del Nuevo Insumo:</label><input type="text" id="stockNuevoNombre" placeholder="Ej: Cobertura Frutilla"></div>
            
            <div style="display:flex; gap:10px; margin:10px 0">
                <div style="flex:1"><label>Precio Compra $:</label><input type="number" id="stockPrecio" placeholder="Ej: 2450"></div>
                <div style="flex:1"><label>Formato Original:</label><input type="number" id="stockFormato" placeholder="Ej: 1000"></div>
            </div>
            <button class="action-btn btn-calc" onclick="guardarInsumoStock()">🛒 GUARDAR COMPRA EN INVENTARIO</button>
            
            <label style="margin-top:20px;">Maestro de Insumos Base (Precio / Formato):</label>
            <div class="list-container" id="listaInsumosContainer" style="max-height:160px;"></div>

            <div class="backup-panel">
                <div class="backup-title">🛡️ Respaldo Total de Seguridad</div>
                <div class="backup-buttons">
                    <button class="btn-backup" onclick="exportarRespaldo()">💾 Guardar Respaldo</button>
                    <button class="btn-backup" onclick="document.getElementById('inputImportar').click()">📂 Subir Respaldo</button>
                </div>
                <input type="file" id="inputImportar" style="display:none" accept=".json" onchange="importarRespaldo(event)">
            </div>
        </div>

        <!-- SECCIÓN 5: BODEGA (NUEVA - INVENTARIO EN TIEMPO REAL) -->
        <div id="sec-bodega" class="section">
            <label style="margin-bottom:5px; color:#E91E63;">Nivel de Insumos en Tiempo Real</label>
            <label style="font-size:0.75rem; color:#666; font-weight:normal; margin-bottom:15px;">* Las alertas rojas indican stock menor al 25%.</label>
            <div class="list-container" id="listaBodegaContainer" style="max-height:480px;"></div>
        </div>
    </div>

    <script>
        const INSUMOS_DEFAULT = {
            "mantequilla": [3000, 250, 250], "azúcar rubia": [1450, 500, 500], "azúcar blanca": [1450, 1000, 1000],
            "huevo": [300, 1, 12], "leche": [1350, 1000, 1000], "vinagre": [990, 500, 500], "vainilla": [1200, 100, 100],
            "colorante rojo en polvo": [2000, 20, 20], "harina": [1590, 1000, 1000], "maicena": [2990, 250, 250],
            "polvo para hornear": [2470, 200, 200], "bicarbonato de sodio": [580, 10, 10], 
            "chips de chocolate blanco": [5000, 312, 312], "chips de chocolate negro": [4930, 200, 200],
            "cacao amargo": [2500, 150, 150], "aceite maravilla": [2450, 900, 900], "nueces picadas": [10000, 1000, 1000],
            "cerveza negra": [1450, 470, 470], "miel": [8750, 1000, 1000], "arándanos": [2390, 125, 125],
            "alulosa": [7170, 500, 500], "platano": [795, 500, 500], "harina mix orgran": [2890, 500, 500],
            "yogurt griego": [590, 150, 150], "azúcar flor": [2850, 1000, 1000], "avena": [2550, 700, 700],
            "manzana verde": [1295, 500, 500], "pistachos": [4690, 100, 100], "mini m&m": [3150, 31, 31],
            "mini malvaviscos": [3090, 400, 400], "te match en polvo": [9990, 100, 100], "harina de avena": [2490, 850, 850],
            "pasas rubias": [999, 100, 100], "coco rayado": [1920, 100, 100], "harina de almendra": [13990, 500, 500],
            "crema de coco": [3430, 396, 396], "margarina": [2990, 900, 900], "esencia de pan de pascua": [7000, 1000, 1000],
            "nuez moscada": [690, 5, 5], "jengibre molido": [430, 15, 15], "harina de arroz": [1280, 500, 500],
            "fruta confitada": [4790, 1000, 1000], "levadura": [2290, 125, 125], "leche en polvo": [12790, 1440, 1440],
            "glucosa": [2190, 1000, 1000], "harina panificable": [7190, 700, 700]
        };

        const RECETAS_DEFAULT = {
            "101": {"nombre": "Alfajor de Cerveza y Nuez", "pasos": "1. Batir la mantequilla con el azúcar rubia.\n2. Añadir chips de chocolate por encima y mezclar dentro.", "ingredientes": [{"ing":"mantequilla","cant":200},{"ing":"miel","cant":35},{"ing":"cerveza negra","cant":120},{"ing":"nueces picadas","cant":40}]},
            "102": {"nombre": "Cookies New York Avena y Manzana", "pasos": "1. Mezclar húmedos, añadir manzanas picadas.\n2. Sumar avena y harina.", "ingredientes": [{"ing":"avena","cant":200},{"ing":"harina","cant":250},{"ing":"mantequilla","cant":100},{"ing":"manzana verde","cant":150}]},
            "103": {"nombre": "Profiteroles Tradicionales", "costo_tanda": 2970},
            "104": {"nombre": "Muffins de Frambuesa", "costo_tanda": 6100},
            "105": {"nombre": "Pan de Pascua Navideño", "costo_tanda": 9400},
            "106": {"nombre": "Cheesecake New York", "costo_tanda": 12500},
            "107": {"nombre": "Pie de Limón Real", "costo_tanda": 7200},
            "108": {"nombre": "Torta Fría ChocoFresa", "costo_tanda": 13800},
            "109": {"nombre": "Marquesa de Oreo y Nutella", "costo_tanda": 8900},
            "110": {"nombre": "Macarons Método Francés", "costo_tanda": 7100},
            "111": {"nombre": "Brownie Tradicional", "costo_tanda": 7200},
            "112": {"nombre": "Alfajor Sable de Coco", "costo_tanda": 5500},
            "113": {"nombre": "Alfajor Saludable", "costo_tanda": 4800},
            "114": {"nombre": "Alfajor Blanco y Frambuesa", "costo_tanda": 5900},
            "115": {"nombre": "Alfajor Choco Baileys", "costo_tanda": 6200}
        };
        
        let insumos = INSUMOS_DEFAULT;
        let recetas = RECETAS_DEFAULT;
        let tempIng = [];
        let modoEdicion = false;
        let idEditando = null;
        let idSeleccionadoParaDeduccion = null;

        document.addEventListener("DOMContentLoaded", function() {
            try {
                let savedIns = localStorage.getItem('pasteleria_v9_insumos') || localStorage.getItem('pasteleria_v8_insumos') || localStorage.getItem('pasteleria_master_insumos');
                if (savedIns) {
                    let parsed = JSON.parse(savedIns);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) insumos = parsed;
                }
                
                let savedRec = localStorage.getItem('pasteleria_v9_recetas') || localStorage.getItem('pasteleria_v8_recetas') || localStorage.getItem('pasteleria_master_recetas');
                if (savedRec) {
                    let parsed = JSON.parse(savedRec);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) recetas = parsed;
                }
            } catch(e) {
                console.warn("Caché dañado. Cargando valores por defecto.");
                insumos = INSUMOS_DEFAULT;
                recetas = RECETAS_DEFAULT;
            }

            try {
                Object.keys(recetas).forEach(id => {
                    if (recetas[id] && recetas[id].ingredientes && !Array.isArray(recetas[id].ingredientes)) {
                        let viejoObj = recetas[id].ingredientes;
                        let nuevoArr = [];
                        for (let k in viejoObj) {
                            if (viejoObj.hasOwnProperty(k)) nuevoArr.push({ ing: k, cant: viejoObj[k] });
                        }
                        recetas[id].ingredientes = nuevoArr;
                    }
                });
                Object.keys(insumos).forEach(k => {
                    if (insumos[k] && Array.isArray(insumos[k]) && insumos[k].length === 2) {
                        insumos[k] = [insumos[k][0], insumos[k][1], insumos[k][1]];
                    }
                });
            } catch(e) {}

            try { poblarS(); renderListas(); nextId(); if (document.getElementById('stockSelectInsumo').value) cStock(); } catch(e) {}
        });

        function sincronizar() {
            try {
                localStorage.setItem('pasteleria_v9_insumos', JSON.stringify(insumos));
                localStorage.setItem('pasteleria_v9_recetas', JSON.stringify(recetas));
            } catch(e) {}
            renderListas();
            poblarS();
            nextId();
        }

        // TABS ACTUALIZADOS PARA MANEJAR 5 SECCIONES
        function switchTab(t) {
            try {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
                
                const activeBtn = document.getElementById('tab-' + t);
                if (activeBtn) activeBtn.classList.add('active');
                
                const activeSec = document.getElementById('sec-' + t);
                if (activeSec) activeSec.classList.add('active');
                
                const mainGreeting = document.getElementById('mainGreeting');
                if (mainGreeting) mainGreeting.style.display = (t === 'calc') ? 'block' : 'none';
                
                if (t !== 'crear' && t !== 'lista' && modoEdicion) {
                    cancelarEdicion();
                }
            } catch(e) { console.error("Error cambiando de tab"); }
        }

        function poblarS() {
            try {
                const s1 = document.getElementById('recetaSelectInsumo');
                const s2 = document.getElementById('stockSelectInsumo');
                s1.innerHTML = ''; s2.innerHTML = '';
                Object.keys(insumos).sort().forEach(n => {
                    const o = document.createElement('option'); o.value = n; o.innerText = n;
                    s1.appendChild(o.cloneNode(true)); s2.appendChild(o);
                });
            } catch(e) {}
        }

        function toggleDetails(id) {
            try {
                const el = document.getElementById('det-' + id);
                if(!el) return;
                const head = el.previousElementSibling;
                const isShow = el.classList.contains('show');
                document.querySelectorAll('.recipe-details').forEach(d => d.classList.remove('show'));
                document.querySelectorAll('.recipe-header').forEach(h => h.classList.remove('active'));
                if (!isShow) { el.classList.add('show'); head.classList.add('active'); }
            } catch(e) {}
        }

        function renderListas() {
            // RENDER RECETAS
            try {
                const pBox = document.getElementById('listaProductosContainer'); pBox.innerHTML = '';
                Object.keys(recetas).sort((a,b) => parseInt(a)-parseInt(b)).forEach(id => {
                    const wrap = document.createElement('div'); wrap.className = 'recipe-accordion';
                    let cost = getCost(id);
                    
                    let pasosRaw = recetas[id].pasos ? String(recetas[id].pasos) : "";
                    let pasosHtml = pasosRaw ? `<div class="steps-box"><b>PASO A PASO:</b><br>${pasosRaw.replace(/\n/g, '<br>').replace(/\n/g, '<br>')}</div>` : `<div class="steps-box" style="color:#999; font-style:italic;">Sin instrucciones registradas.</div>`;
                    
                    let ingListHtml = '<div style="font-size:0.8rem; color:#999; padding:4px 0;">Receta base sin desglose.</div>';
                    if (recetas[id].ingredientes && Array.isArray(recetas[id].ingredientes)) {
                        ingListHtml = recetas[id].ingredientes.map(item => `
                            <div class="ingredient-row"><span>• ${item.ing}</span> <span>${item.cant} gr/ml/un</span></div>
                        `).join('');
                    }

                    wrap.innerHTML = `
                    <div class="recipe-header" onclick="toggleDetails('${id}')">
                        <span><strong>ID ${id}</strong> - ${recetas[id].nombre}</span>
                        <span class="cost-badge">$${Math.round(cost)} ▼</span>
                    </div>
                    <div id="det-${id}" class="recipe-details">
                        <div style="font-size:0.75rem; color:#E91E63; font-weight:bold; margin-bottom:6px">FÓRMULA / MATERIALES:</div>
                        ${ingListHtml}
                        ${pasosHtml}
                        <div class="recipe-actions">
                            <button class="btn-inline btn-edit" onclick="cargarParaEditar('${id}')">✏️ Editar Estructura</button>
                            <button class="btn-inline btn-delete" onclick="eliminarReceta('${id}')">❌ Eliminar</button>
                        </div>
                    </div>`;
                    pBox.appendChild(wrap);
                });
            } catch(e) {}

            // RENDER STOCK (Listado Clásico: Precio y Formato Original)
            try {
                const iBox = document.getElementById('listaInsumosContainer'); iBox.innerHTML = '';
                Object.keys(insumos).sort().forEach(n => {
                    if(!insumos[n] || !Array.isArray(insumos[n])) return;
                    let precio = insumos[n][0];
                    let formatoOriginal = insumos[n][1];
                    iBox.innerHTML += `<div style="font-size:0.85rem; padding:8px 4px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;"><span>• ${n}</span><span style="color:#555; font-weight:bold;">$${precio} / ${formatoOriginal} un/gr/ml</span></div>`;
                });
            } catch(e) {}

            // RENDER BODEGA (Inventario en Tiempo Real, Alertas y Costos)
            try {
                const bBox = document.getElementById('listaBodegaContainer'); bBox.innerHTML = '';
                Object.keys(insumos).sort().forEach(n => {
                    if(!insumos[n] || !Array.isArray(insumos[n]) || insumos[n].length < 2) return;
                    let precio = insumos[n][0];
                    let formatoOriginal = insumos[n][1];
                    let cantidadActual = insumos[n][2] !== undefined ? insumos[n][2] : formatoOriginal;
                    
                    let umbralCritico = formatoOriginal * 0.25;
                    let esCritico = cantidadActual <= umbralCritico;
                    
                    let rowClass = esCritico ? 'stock-row stock-alert' : 'stock-row';
                    let stockText = esCritico ? `⚠️ ¡BAJO! ${Math.round(cantidadActual)}` : `${Math.round(cantidadActual)}`;
                    
                    bBox.innerHTML += `
                    <div class="${rowClass}">
                        <div class="stock-row-top">
                            <span class="stock-name" style="font-weight:600;">• ${n}</span>
                            <span>${stockText} / <small>${formatoOriginal} un/gr/ml</small></span>
                        </div>
                        <div class="stock-row-bottom">
                            <span>💰 Última Compra: <b>$${precio} CLP</b></span>
                            <span>Costo x unidad/gr: $${(precio/formatoOriginal).toFixed(1)}</span>
                        </div>
                    </div>`;
                });
            } catch(e) {}
        }

        function getCost(id) {
            try {
                const r = recetas[id]; 
                if (!r || !r.ingredientes || !Array.isArray(r.ingredientes)) return r.costo_tanda || 0;
                let total = 0; 
                r.ingredientes.forEach(item => {
                    if (item && item.ing && insumos[item.ing] && Array.isArray(insumos[item.ing])) {
                        total += (insumos[item.ing][0] / insumos[item.ing][1]) * item.cant;
                    }
                });
                return total;
            } catch(e) { return 0; }
        }

        function nextId() {
            if (modoEdicion) return;
            try {
                const ids = Object.keys(recetas).map(k => parseInt(k)).filter(n => !isNaN(n));
                document.getElementById('newRecetaId').value = ids.length ? Math.max(...ids) + 1 : 101;
            } catch(e) {}
        }

        function calcularPrecio() {
            try {
                const id = document.getElementById('calcId').value.trim();
                const cant = parseFloat(document.getElementById('calcCantidad').value);
                if (!recetas[id] || isNaN(cant) || cant <= 0) {
                    document.getElementById('deductStockPanel').style.display = "none";
                    return alert('Amorcito, ingresa un ID y cantidad válida. 💕');
                }
                
                const unit = getCost(id) / cant;
                document.getElementById('resProd').innerText = `✨ ${recetas[id].nombre} ✨`;
                document.getElementById('resCost').innerText = `Costo Unitario Real: $${Math.round(unit)} CLP`;
                document.getElementById('resVenta').innerText = `VENDER A (+60%): $${Math.ceil((unit * 1.6) / 10) * 10} CLP`;
                
                if (recetas[id].ingredientes && recetas[id].ingredientes.length > 0) {
                    idSeleccionadoParaDeduccion = id;
                    document.getElementById('deductStockPanel').style.display = "block";
                } else {
                    document.getElementById('deductStockPanel').style.display = "none";
                }
            } catch(e) {}
        }

        function ejecutarDescuentoInsumos() {
            try {
                if (!idSeleccionadoParaDeduccion || !recetas[idSeleccionadoParaDeduccion]) return;
                let id = idSeleccionadoParaDeduccion;
                let r = recetas[id];
                
                r.ingredientes.forEach(item => {
                    if (insumos[item.ing]) {
                        if (insumos[item.ing][2] === undefined) insumos[item.ing][2] = insumos[item.ing][1];
                        insumos[item.ing][2] = Math.max(0, insumos[item.ing][2] - item.cant);
                    }
                });
                
                sincronizar();
                alert(`¡Inventario rebajado con éxito! Se descontaron los insumos de bodega para "${r.nombre}". 💕`);
                document.getElementById('deductStockPanel').style.display = "none";
            } catch(e) {}
        }

        function agregarIngredienteATemp() {
            try {
                const i = document.getElementById('recetaSelectInsumo').value, c = parseFloat(document.getElementById('recetaCantInsumo').value);
                if (!i || isNaN(c) || c <= 0) return alert('Por favor, ingresa una cantidad de insumo válida. 💕');
                
                tempIng.push({ ing: i, cant: c });
                actualizarListaVisualTemporal();
                document.getElementById('recetaCantInsumo').value = '';
            } catch(e) {}
        }

        function eliminarIngredienteTemporal(index) {
            tempIng.splice(index, 1);
            actualizarListaVisualTemporal();
        }

        function actualizarListaVisualTemporal() {
            try {
                const list = document.getElementById('tempIngredientsList'); list.innerHTML = '';
                if (tempIng.length === 0) {
                    list.innerText = 'Aún no hay ingredientes...';
                    return;
                }
                tempIng.forEach((item, index) => {
                    list.innerHTML += `
                    <div class="temp-row">
                        <span>• <b>${item.ing}</b>: ${item.cant} (gr/ml/un)</span>
                        <button class="btn-remove-ing" onclick="eliminarIngredienteTemporal(${index})">❌ Quitar</button>
                    </div>`;
                });
            } catch(e) {}
        }

        function cargarParaEditar(id) {
            try {
                modoEdicion = true;
                idEditando = id;
                const r = recetas[id];
                
                document.getElementById('newRecetaNombre').value = r.nombre;
                document.getElementById('newRecetaId').value = id;
                document.getElementById('newRecetaPasos').value = r.pasos || '';
                
                tempIng = r.ingredientes ? JSON.parse(JSON.stringify(r.ingredientes)) : [];
                actualizarListaVisualTemporal();

                document.getElementById('editIndicatorPanel').style.display = "flex";
                document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR CAMBIOS EN LA RECETA";
                switchTab('crear');
            } catch(e) {}
        }

        function cancelarEdicion() {
            try {
                modoEdicion = false;
                idEditando = null;
                document.getElementById('newRecetaNombre').value = '';
                document.getElementById('newRecetaPasos').value = '';
                tempIng = [];
                actualizarListaVisualTemporal();
                document.getElementById('editIndicatorPanel').style.display = "none";
                document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR RECETA COMPLETA";
                nextId();
            } catch(e) {}
        }

        function eliminarReceta(id) {
            try {
                if (confirm(`¿Amorcito, de verdad deseas eliminar la receta "${recetas[id].nombre}"? 💔`)) {
                    delete recetas[id];
                    sincronizar();
                }
            } catch(e) {}
        }

        function guardarNuevaReceta() {
            try {
                const n = document.getElementById('newRecetaNombre').value.trim(), id = document.getElementById('newRecetaId').value;
                const p = document.getElementById('newRecetaPasos').value.trim();
                
                if (!n || !tempIng.length) return alert('Completa el nombre y añade mínimo 1 ingrediente para la fórmula. 💕');
                
                recetas[id] = {
                    nombre: n, 
                    pasos: p,
                    ingredientes: JSON.parse(JSON.stringify(tempIng))
                };
                
                let msg = modoEdicion ? '¡Receta e instrucciones modificadas con éxito! 🍰' : `¡Receta creada con éxito bajo el ID ${id}! 🍰`;
                
                modoEdicion = false;
                idEditando = null;
                tempIng = []; 
                document.getElementById('newRecetaNombre').value = ''; 
                document.getElementById('newRecetaPasos').value = ''; 
                actualizarListaVisualTemporal();
                document.getElementById('editIndicatorPanel').style.display = "none";
                document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR RECETA COMPLETA";
                
                sincronizar(); 
                alert(msg); 
                switchTab('calc'); 
                document.getElementById('calcId').value = id;
            } catch(e) {}
        }

        function altStock() {
            try {
                const m = document.querySelector('input[name="stockM"]:checked').value;
                document.getElementById('g-update').style.display = (m === 'update') ? 'block' : 'none';
                document.getElementById('g-new').style.display = (m === 'new') ? 'block' : 'none';
                if (m === 'update') cStock();
                else { document.getElementById('stockPrecio').value = ''; document.getElementById('stockFormato').value = ''; }
            } catch(e) {}
        }

        function cStock() {
            try {
                const n = document.getElementById('stockSelectInsumo').value;
                if (insumos[n]) { 
                    document.getElementById('stockPrecio').value = insumos[n][0]; 
                    document.getElementById('stockFormato').value = insumos[n][1]; 
                }
            } catch(e) {}
        }

        function guardarInsumoStock() {
            try {
                const m = document.querySelector('input[name="stockM"]:checked').value;
                let n = (m === 'new') ? document.getElementById('stockNuevoNombre').value.trim().toLowerCase() : document.getElementById('stockSelectInsumo').value;
                const p = parseFloat(document.getElementById('stockPrecio').value), f = parseFloat(document.getElementById('stockFormato').value);
                
                if (!n || isNaN(p) || isNaN(f)) return alert('Ingresa valores válidos. 💕');
                if (m === 'new' && insumos[n]) return alert('Este insumo ya existe.');
                
                // Actualiza precio, formato y resetea el inventario disponible al formato recién comprado.
                insumos[n] = [p, f, f]; 
                
                document.getElementById('stockNuevoNombre').value = '';
                sincronizar(); 
                alert('¡Insumo registrado! Se actualizó su precio y se llenó su stock en la bodega. 🛒✨');
                document.querySelectorAll('input[name="stockM"]')[0].checked = true;
                altStock();
            } catch(e) {}
        }

        function exportarRespaldo() {
            try {
                const datos = { insumos, recetas };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datos));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "respaldo_pasteleria_master.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            } catch(e) {}
        }

        function importarRespaldo(event) {
            try {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.insumos && parsed.recetas) {
                            insumos = parsed.insumos;
                            recetas = parsed.recetas;
                            sincronizar();
                            alert('¡Copia de seguridad subida y restaurada con éxito! 📂✨');
                        } else { alert('Formato de archivo inválido.'); }
                    } catch (err) {}
                };
                reader.readAsText(file);
            } catch(e) {}
        }
    </script>
</body>
</html>
