<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Pastelera Ultimate v5 - Stock Inteligente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #FFF5F6; color: #2D2D2D; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-bottom: 30px; -webkit-text-size-adjust: 100%; }
        
        .container { background: #FFFFFF; border: 1px solid #F0A6CA; border-radius: 20px; padding: 20px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(233, 30, 99, 0.05); }
        h1 { color: #E91E63; font-size: 1.2rem; text-align: center; margin-bottom: 18px; line-height: 1.4; font-weight: 700; }
        
        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #FFE5EC; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px 2px; font-size: 0.8rem; font-weight: bold; border: none; border-radius: 9px; background: transparent; color: #2D2D2D; cursor: pointer; transition: all 0.2s ease; text-align: center; -webkit-tap-highlight-color: transparent; }
        .tab-btn.active { background: #FFFFFF; color: #E91E63; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        
        .section { display: none; }
        .section.active { display: block; }

        /* UI Inputs */
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #4A4A4A; }
        input, select, textarea { width: 100%; padding: 12px; font-size: 1rem; border: 1.5px solid #E2E8F0; border-radius: 10px; background-color: #FFFFFF; color: #000000; outline: none; -webkit-appearance: none; }
        input:focus, select:focus, textarea:focus { border-color: #F0A6CA; }
        textarea { resize: vertical; min-height: 90px; font-family: inherit; }
        
        button.action-btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; margin-top: 5px; -webkit-tap-highlight-color: transparent; }
        .btn-calc { background-color: #94D2BD; color: #2D2D2D; }
        .btn-calc:active { background-color: #7fc2ad; }
        .btn-save { background-color: #F0A6CA; color: #2D2D2D; }
        .btn-save:active { background-color: #e295b9; }
        .btn-deduct { background-color: #FFB5A7; color: #2D2D2D; margin-top: 10px; border: 1px solid #F0A6CA; }
        .btn-deduct:active { background-color: #fca395; }

        /* Lists and Accordions */
        .list-container { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; max-height: 380px; overflow-y: auto; padding: 5px; margin-bottom: 15px; }
        
        .recipe-accordion { margin-bottom: 8px; border: 1px solid #FFF0F2; border-radius: 10px; overflow: hidden; }
        .recipe-header { background: #fff; padding: 14px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .recipe-header.active { border-bottom: 1px solid #FFE5EC; background-color: #FFF9FA; }
        .recipe-header span { font-size: 0.9rem; font-weight: 600; }
        .recipe-header .cost-badge { color: #E91E63; font-weight: 700; }
        
        .recipe-details { display: none; background: #FFFBFC; padding: 12px; animation: slideDown 0.2s ease-out; }
        .recipe-details.show { display: block; }
        .ingredient-row { font-size: 0.85rem; padding: 7px 0; border-bottom: 1px solid #fdf0f3; color: #555; display: flex; justify-content: space-between; align-items: center; }
        
        .steps-box { background: #FFFFFF; border: 1px solid #FFE5EC; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.85rem; color: #4A4A4A; white-space: pre-wrap; line-height: 1.4; }
        
        .recipe-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px dashed #FFE5EC; padding-top: 10px; }
        .btn-inline { flex: 1; padding: 10px; font-size: 0.8rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
        .btn-edit { background-color: #E0F2F1; color: #00796B; }
        .btn-delete { background-color: #FFEBEE; color: #C62828; }

        /* Temporary Ingredient Box */
        .temp-ingredients { background: #F7F9FA; border: 1px dashed #F0A6CA; border-radius: 10px; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; }
        .temp-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid #EDF2F7; }
        .temp-row:last-child { border-bottom: none; }
        .btn-remove-ing { background: #FFEBEE; color: #D32F2F; border: none; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* Stock Warning Styles */
        .stock-row { font-size: 0.85rem; padding: 10px 6px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .stock-alert { color: #C62828 !important; font-weight: bold !important; background-color: #FFEBEE; border-radius: 6px; padding: 2px 6px; }
        .stock-normal { color: #2E7D32; font-weight: 600; }

        .results { background-color: #FFE5EC; border: 1px solid #F0A6CA; border-radius: 14px; padding: 16px; text-align: center; margin-top: 18px; }
        .res-price { font-size: 1.4rem; font-weight: 800; color: #C9184A; }

        /* Backup Utilities */
        .backup-panel { border-top: 1px solid #E2E8F0; margin-top: 25px; padding-top: 15px; }
        .backup-title { font-size: 0.8rem; font-weight: 700; color: #777; text-transform: uppercase; margin-bottom: 8px; }
        .backup-buttons { display: flex; gap: 8px; }
        .btn-backup { flex: 1; padding: 10px; font-size: 0.75rem; font-weight: bold; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer; color: #475569; text-align: center; }
        
        .edit-indicator { background: #FFF3CD; border: 1px solid #FFEBA2; color: #856404; padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn-cancel-edit { background: none; border: none; color: #A52A2A; font-weight: bold; cursor: pointer; text-decoration: underline; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainGreeting">¿Qué deseas calcular hoy amorcito?<br>¿Qué cosa rica vas a cocinar? 👩🏻‍🍳❤️</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calc')">🧮 Calcular</button>
            <button class="tab-btn" onclick="switchTab('lista')">📖 Lista IDs</button>
            <button class="tab-btn" onclick="switchTab('crear')">🍰 +Receta</button>
            <button class="tab-btn" onclick="switchTab('stock')">🛒 Stock</button>
        </div>
        
        <!-- SECCIÓN 1: CALCULAR PRECIO + DESCUENTO DE STOCK -->
        <div id="sec-calc" class="section active">
            <label>1. Código ID del dulce:</label>
            <input type="number" id="calcId" pattern="[0-9]*" inputmode="numeric" placeholder="Ej: 101" style="margin-bottom:15px">
            <label>2. ¿Cuántas unidades salieron?:</label>
            <input type="number" id="calcCantidad" pattern="[0-9]*" inputmode="numeric" placeholder="Ej: 12">
            <button class="action-btn btn-calc" onclick="calcularPrecio()">💰 CALCULAR PRECIO DE VENTA</button>
            
            <div class="results">
                <div id="resProd" style="font-weight:700">Preparación: ---</div>
                <div id="resCost" style="font-size:0.9rem; color:#555">Costo Unitario Real: $0 CLP</div>
                <div class="res-price" id="resVenta" style="margin-bottom: 5px;">VENDER A (+60%): $0 CLP</div>
                
                <!-- Botón dinámico para rebajar ingredientes del inventario real -->
                <div id="deductStockPanel" style="display:none; margin-top:12px; border-top:1px dashed #F0A6CA; padding-top:10px;">
                    <button class="action-btn btn-deduct" onclick="ejecutarDescuentoInsumos()">👩🏻‍🍳 REGISTRAR EN COCINA Y DESCONTAR INSUMOS</button>
                </div>
            </div>
        </div>
        
        <!-- SECCIÓN 2: LISTA DE IDs CON PASO A PASO -->
        <div id="sec-lista" class="section">
            <label style="margin-bottom:10px">Toca una receta para ver sus ingredientes y paso a paso:</label>
            <div class="list-container" id="listaProductosContainer"></div>
        </div>
        
        <!-- SECCIÓN 3: CREAR O EDITAR RECETAS CON PASO A PASO -->
        <div id="sec-crear" class="section">
            <div id="editIndicatorPanel" class="edit-indicator" style="display:none;">
                <span>✏️ Modo Edición Activo</span>
                <button class="btn-cancel-edit" onclick="cancelarEdicion()">Cancelar</button>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div style="flex:2"><label>Nombre Receta:</label><input type="text" id="newRecetaNombre" placeholder="Ej: Alfajor Maicena"></div>
                <div style="flex:1"><label>ID Receta:</label><input type="text" id="newRecetaId" readonly style="background:#f9f9f9; color:#E91E63; font-weight:bold; text-align:center;"></div>
            </div>
            
            <div style="margin-bottom:15px;">
                <label>Paso a Paso / Instrucciones de preparación:</label>
                <textarea id="newRecetaPasos" placeholder="Ej: 1. Derretir el chocolate al principio de la mezcla.
2. Reservar la mitad para verter al final del horneado..."></textarea>
            </div>

            <div style="border-top:1px solid #eee; margin:15px 0; padding-top:10px">
                <label style="color:#E91E63;">Vincular Insumo a la Fórmula:</label>
                <select id="recetaSelectInsumo" style="margin-bottom:10px"></select>
                <input type="number" id="recetaCantInsumo" placeholder="Cantidad usada (gr/ml/un)">
                <button class="action-btn" style="background:#E2E8F0; color:#2D2D2D; font-size:0.85rem; margin-top:10px;" onclick="agregarIngredienteATemp()">➕ Vincular Insumo a la Mezcla</button>
            </div>
            
            <label style="margin-top:10px;">Materiales agregados (Fórmula base):</label>
            <div class="temp-ingredients" id="tempIngredientsList">Aún no hay ingredientes...</div>
            <button class="action-btn btn-save" id="btnGuardarReceta" onclick="guardarNuevaReceta()">💾 GUARDAR RECETA COMPLETA</button>
        </div>
        
        <!-- SECCIÓN 4: STOCK INTELIGENTE CON HISTORIAL DE CONSUMOS Y ALERTAS EN ROJO -->
        <div id="sec-stock" class="section">
            <div style="display:flex; gap:10px; margin-bottom:15px; font-weight:bold; font-size:0.9rem;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="radio" name="stockM" value="update" checked onchange="altStock()" style="width:auto;"> Reestock / Editar</label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="radio" name="stockM" value="new" onchange="altStock()" style="width:auto;"> Nuevo Material</label>
            </div>
            <div id="g-update"><label>Selecciona Insumo a reabastecer:</label><select id="stockSelectInsumo" onchange="cStock()"></select></div>
            <div id="g-new" style="display:none"><label>Nombre del Nuevo Insumo:</label><input type="text" id="stockNuevoNombre" placeholder="Ej: Aceite de Girasol"></div>
            
            <div style="display:flex; gap:10px; margin:10px 0">
                <div style="flex:1"><label>Precio Compra $:</label><input type="number" id="stockPrecio" placeholder="Ej: 2450"></div>
                <div style="flex:1"><label>Formato Original:</label><input type="number" id="stockFormato" placeholder="Ej: 1000"></div>
            </div>
            <button class="action-btn btn-calc" onclick="guardarInsumoStock()">🛒 ACTUALIZAR CONTENIDO DE BODEGA</button>
            
            <label style="margin-top:20px;">Nivel de Insumos Disponible (Rojo bajo 25%):</label>
            <div class="list-container" id="listaInsumosContainer" style="max-height:180px;"></div>

            <div class="backup-panel">
                <div class="backup-title">🛡️ Respaldo Total de Seguridad</div>
                <div class="backup-buttons">
                    <button class="btn-backup" onclick="exportarRespaldo()">💾 Guardar Respaldo</button>
                    <button class="btn-backup" onclick="document.getElementById('inputImportar').click()">📂 Subir Respaldo</button>
                </div>
                <input type="file" id="inputImportar" style="display:none" accept=".json" onchange="importarRespaldo(event)">
            </div>
        </div>
    </div>

    <script>
        const INSUMOS_DEFAULT = {"mantequilla":[3000,250,250],"azúcar rubia":[1450,500,500],"azúcar blanca":[1450,1000,1000],"huevo":[300,1,12],"leche":[1350,1000,1000],"vinagre":[990,500,500],"vainilla":[1200,100,100],"harina":[1590,1000,1000],"maicena":[2990,250,250],"polvo para hornear":[2470,200,200],"bicarbonato de sodio":[580,10,10],"chips de chocolate blanco":[5000,312,312],"chips de chocolate negro":[4930,200,200],"cacao amargo":[2500,150,150],"aceite maravilla":[2450,900,900],"nueces picadas":[10000,1000,1000],"cerveza negra":[1450,470,470],"miel":[8750,1000,1000]};
        const RECETAS_DEFAULT = {
            "101": {"nombre": "Alfajor de Cerveza y Nuez", "pasos": "1. Batir la mantequilla con el azúcar rubia hasta cremar.\n2. Agregar el huevo y la miel.\n3. Incorporar la cerveza negra poco a poco alternando con los secos.\n4. Añadir las nueces picadas al final de la mezcla de forma envolvente.", "ingredientes": {"mantequilla": 200, "azúcar rubia": 200, "huevo": 1, "miel": 35, "cerveza negra": 120, "harina": 460, "maicena": 120, "polvo para hornear": 8, "nueces picadas": 40}},
            "102": {"nombre": "Cookies New York Avena y Manzana", "pasos": "1. Mezclar ingredientes húmedos.\n2. Añadir la manzana picada fina al inicio.\n3. Agregar avena y harina.\n4. Hornear en porciones grandes.", "ingredientes": {"avena": 200, "harina": 250, "mantequilla": 100, "manzana verde": 150}},
            "103": {"nombre": "Profiteroles Tradicionales", "pasos": "1. Hervir agua con mantequilla.\n2. Agregar harina de golpe.\n3. Batir fuera del fuego agregando los huevos uno a uno.", "ingredientes": {"harina": 150, "mantequilla": 100, "huevo": 4}}
        };
        
        // Unificación del namespace de persistencia
        let insumos = JSON.parse(localStorage.getItem('insumos_master_v5')) || INSUMOS_DEFAULT;
        let recetas = JSON.parse(localStorage.getItem('recetas_master_v5')) || RECETAS_DEFAULT;
        let tempIng = {};
        
        let modoEdicion = false;
        let idEditando = null;
        let idSeleccionadoParaDeduccion = null;

        // MULTI-VERSION INTEGRITY MIGRATION SCRIPT
        // Si el usuario viene de v4, sus insumos tienen largo 2 [precio, formato].
        // Esta subrutina autodetecta y migra a largo 3 [precio, formato_original, stock_disponible] para no perder datos.
        Object.keys(insumos).forEach(k => {
            if (Array.isArray(insumos[k]) && insumos[k].length === 2) {
                insumos[k] = [insumos[k][0], insumos[k][1], insumos[k][1]]; // Inicializa stock actual lleno
            }
        });

        function sincronizar() {
            localStorage.setItem('insumos_master_v5', JSON.stringify(insumos));
            localStorage.setItem('recetas_master_v5', JSON.stringify(recetas));
            renderListas();
            poblarS();
            nextId();
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn, .section').forEach(el => el.classList.remove('active'));
            const map = {'calc':0,'lista':1,'crear':2,'stock':3};
            document.querySelectorAll('.tab-btn')[map[t]].classList.add('active');
            document.getElementById('sec-'+t).classList.add('active');
            document.getElementById('mainGreeting').style.display = (t==='calc')?'block':'none';
            
            if (t !== 'crear' && t !== 'lista' && modoEdicion) {
                cancelarEdicion();
            }
        }

        function poblarS() {
            const s1=document.getElementById('recetaSelectInsumo'), s2=document.getElementById('stockSelectInsumo');
            s1.innerHTML=''; s2.innerHTML='';
            Object.keys(insumos).sort().forEach(n=>{
                const o=document.createElement('option'); o.value=n; o.innerText=n;
                s1.appendChild(o.cloneNode(true)); s2.appendChild(o);
            });
        }

        function toggleDetails(id) {
            const el = document.getElementById('det-'+id);
            const head = el.previousElementSibling;
            const isShow = el.classList.contains('show');
            document.querySelectorAll('.recipe-details').forEach(d=>d.classList.remove('show'));
            document.querySelectorAll('.recipe-header').forEach(h=>h.classList.remove('active'));
            if(!isShow) { el.classList.add('show'); head.classList.add('active'); }
        }

        function renderListas() {
            // Render Recetas
            const pBox = document.getElementById('listaProductosContainer'); pBox.innerHTML = '';
            Object.keys(recetas).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(id=>{
                const wrap = document.createElement('div'); wrap.className='recipe-accordion';
                let cost = getCost(id);
                
                let pasosHtml = recetas[id].pasos ? `<div class="steps-box"><b>PASO A PASO:</b>\n${recetas[id].pasos}</div>` : `<div class="steps-box" style="color:#999; font-style:italic;">Sin instrucciones paso a paso registradas.</div>`;
                
                wrap.innerHTML = `
                <div class="recipe-header" onclick="toggleDetails('${id}')">
                    <span><strong>ID ${id}</strong> - ${recetas[id].nombre}</span>
                    <span class="cost-badge">$${Math.round(cost)} ▼</span>
                </div>
                <div id="det-${id}" class="recipe-details">
                    <div style="font-size:0.75rem; color:#E91E63; font-weight:bold; margin-bottom:6px">FÓRMULA / MATERIALES:</div>
                    ${recetas[id].ingredientes ? Object.keys(recetas[id].ingredientes).map(ing=>`
                        <div class="ingredient-row"><span>• ${ing}</span> <span>${recetas[id].ingredientes[ing]} gr/ml/un</span></div>
                    `).join('') : '<div style="font-size:0.8rem; color:#999; padding:4px 0;">Receta base sin desglose detallado.</div>'}
                    
                    ${pasosHtml}
                    
                    <div class="recipe-actions">
                        <button class="btn-inline btn-edit" onclick="cargarParaEditar('${id}')">✏️ Editar Estructura</button>
                        <button class="btn-inline btn-delete" onclick="eliminarReceta('${id}')">❌ Eliminar</button>
                    </div>
                </div>`;
                pBox.appendChild(wrap);
            });

            // Render Stock Inteligente con Alerta de Color Rojo bajo el 25%
            const iBox=document.getElementById('listaInsumosContainer'); iBox.innerHTML='';
            Object.keys(insumos).sort().forEach(n=>{
                let precio = insumos[n][0];
                let formatoOriginal = insumos[n][1];
                let cantidadActual = insumos[n][2] !== undefined ? insumos[n][2] : formatoOriginal;
                
                // Cálculo de criticidad (25%)
                let umbralCritico = formatoOriginal * 0.25;
                let esCritico = cantidadActual <= umbralCritico;
                
                let rowClass = esCritico ? 'stock-row stock-alert' : 'stock-row';
                let indicadorHtml = esCritico ? `⚠️ ¡BAJO! ${Math.round(cantidadActual)}` : `${Math.round(cantidadActual)}`;
                
                iBox.innerHTML+=`
                <div class="${rowClass}">
                    <span style="font-weight: 600;">• ${n}</span>
                    <span>${indicadorHtml} / <small>${formatoOriginal} un/gr/ml</small></span>
                </div>`;
            });
        }

        function getCost(id) {
            const r=recetas[id]; if(!r.ingredientes) return r.costo_tanda || 0;
            let total=0; for(let i in r.ingredientes) if(insumos[i]) total+=(insumos[i][0]/insumos[i][1])*r.ingredientes[i];
            return total;
        }

        function nextId() {
            if (modoEdicion) return;
            const ids=Object.keys(recetas).map(k=>parseInt(k)).filter(n=>!isNaN(n));
            document.getElementById('newRecetaId').value = ids.length?Math.max(...ids)+1:101;
        }

        // ACCIÓN: CALCULAR COSTOS Y HABILITAR REBAJA DE MATERIALES
        function calcularPrecio() {
            const id=document.getElementById('calcId').value.trim();
            const cant=parseFloat(document.getElementById('calcCantidad').value);
            if(!recetas[id] || isNaN(cant) || cant<=0) {
                document.getElementById('deductStockPanel').style.display = "none";
                return alert('Amorcito, ingresa un ID y cantidad válida. 💕');
            }
            
            const unit = getCost(id)/cant;
            document.getElementById('resProd').innerText = `✨ ${recetas[id].nombre} ✨`;
            document.getElementById('resCost').innerText = `Costo Unitario Real: $${Math.round(unit)} CLP`;
            document.getElementById('resVenta').innerText = `VENDER A (+60%): $${Math.ceil((unit*1.6)/10)*10} CLP`;
            
            // Habilitar panel de deducción de stock si la receta contiene ingredientes registrados
            if (recetas[id].ingredientes && Object.keys(recetas[id].ingredientes).length > 0) {
                idSeleccionadoParaDeduccion = id;
                document.getElementById('deductStockPanel').style.display = "block";
            } else {
                document.getElementById('deductStockPanel').style.display = "none";
            }
        }

        // ACCIÓN: DESCONTAR VALORES DE INVENTARIO EN BASE A LA TANDA PREPARADA
        function ejecutarDescuentoInsumos() {
            if (!idSeleccionadoParaDeduccion || !recetas[idSeleccionadoParaDeduccion]) return;
            
            let id = idSeleccionadoParaDeduccion;
            let r = recipes = recetas[id];
            
            // Recorrer ingredientes de la receta y restar del stock actual
            for (let ing in r.ingredientes) {
                if (insumos[ing]) {
                    let cantidadUsada = r.ingredientes[ing];
                    // Si el elemento no tiene campo de stock actual inicializado, se lo agregamos
                    if (insumos[ing][2] === undefined) {
                        insumos[ing][2] = insumos[ing][1];
                    }
                    
                    // Restamos el proporcional usado en la cocina
                    insumos[ing][2] = Math.max(0, insumos[ing][2] - cantidadUsada);
                }
            }
            
            sincronizar();
            alert(`¡Inventario rebajado con éxito! Se descontaron los insumos de " ${r.nombre} ". Revisa el stock para ver las alertas rojas. 👩🏻‍🍳🍰`);
            document.getElementById('deductStockPanel').style.display = "none";
        }

        function agregarIngredienteATemp() {
            const i=document.getElementById('recetaSelectInsumo').value, c=parseFloat(document.getElementById('recetaCantInsumo').value);
            if(!i || isNaN(c) || c<=0) return alert('Por favor, ingresa una cantidad de insumo válida. 💕');
            tempIng[i]=c;
            actualizarListaVisualTemporal();
            document.getElementById('recetaCantInsumo').value='';
        }

        function eliminarIngredienteTemporal(nombreInsumo) {
            if (tempIng[nombreInsumo]) {
                delete tempIng[nombreInsumo];
                actualizarListaVisualTemporal();
            }
        }

        function actualizarListaVisualTemporal() {
            const list=document.getElementById('tempIngredientsList'); list.innerHTML='';
            if (Object.keys(tempIng).length === 0) {
                list.innerText = 'Aún no hay ingredientes...';
                return;
            }
            for(let k in tempIng) {
                list.innerHTML+= `
                <div class="temp-row">
                    <span>• <b>${k}</b>: ${tempIng[k]} (gr/ml/un)</span>
                    <button class="btn-remove-ing" onclick="eliminarIngredienteTemporal('${k}')">❌ Quitar</button>
                </div>`;
            }
        }

        function cargarParaEditar(id) {
            modoEdicion = true;
            idEditando = id;
            const r = recetas[id];
            
            document.getElementById('newRecetaNombre').value = r.nombre;
            document.getElementById('newRecetaId').value = id;
            document.getElementById('newRecetaPasos').value = r.pasos || '';
            
            tempIng = r.ingredientes ? {...r.ingredientes} : {};
            actualizarListaVisualTemporal();

            document.getElementById('editIndicatorPanel').style.display = "flex";
            document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR CAMBIOS EN LA RECETA";
            switchTab('crear');
        }

        function cancelarEdicion() {
            modoEdicion = false;
            idEditando = null;
            document.getElementById('newRecetaNombre').value = '';
            document.getElementById('newRecetaPasos').value = '';
            tempIng = {};
            actualizarListaVisualTemporal();
            document.getElementById('editIndicatorPanel').style.display = "none";
            document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR RECETA COMPLETA";
            nextId();
        }

        function eliminarReceta(id) {
            if (confirm(`¿Amorcito, de verdad deseas eliminar la receta "${recetas[id].nombre}"? 💔`)) {
                delete recetas[id];
                sincronizar();
            }
        }

        function guardarNuevaReceta() {
            const n=document.getElementById('newRecetaNombre').value.trim(), id=document.getElementById('newRecetaId').value;
            const p=document.getElementById('newRecetaPasos').value.trim();
            
            if(!n || !Object.keys(tempIng).length) return alert('Completa el nombre y añade mínimo 1 ingrediente para la fórmula. 💕');
            
            recetas[id]={
                nombre: n, 
                pasos: p,
                ingredientes: {...tempIng}
            };
            
            let msg = modoEdicion ? '¡Receta e instrucciones modificadas con éxito! 🍰' : `¡Receta creada con éxito bajo el ID ${id}! 🍰`;
            
            modoEdicion = false;
            idEditando = null;
            tempIng={}; 
            document.getElementById('newRecetaNombre').value=''; 
            document.getElementById('newRecetaPasos').value=''; 
            actualizarListaVisualTemporal();
            document.getElementById('editIndicatorPanel').style.display = "none";
            document.getElementById('btnGuardarReceta').innerText = "💾 GUARDAR RECETA COMPLETA";
            
            sincronizar(); 
            alert(msg); 
            switchTab('calc'); 
            document.getElementById('calcId').value=id;
        }

        function altStock() {
            const m=document.querySelector('input[name="stockM"]:checked').value;
            document.getElementById('g-update').style.display = (m==='update')?'block':'none';
            document.getElementById('g-new').style.display = (m==='new')?'block':'none';
            if(m==='update') cStock();
            else { document.getElementById('stockPrecio').value=''; document.getElementById('stockFormato').value=''; }
        }

        function cStock() {
            const n=document.getElementById('stockSelectInsumo').value;
            if(insumos[n]) { 
                document.getElementById('stockPrecio').value=insumos[n][0]; 
                document.getElementById('stockFormato').value=insumos[n][1]; 
            }
        }

        function guardarInsumoStock() {
            const m=document.querySelector('input[name="stockM"]:checked').value;
            let n = (m==='new')?document.getElementById('stockNuevoNombre').value.trim().toLowerCase():document.getElementById('stockSelectInsumo').value;
            const p=parseFloat(document.getElementById('stockPrecio').value), f=parseFloat(document.getElementById('stockFormato').value);
            
            if(!n || isNaN(p) || isNaN(f)) return alert('Ingresa valores válidos. 💕');
            
            if(m==='new') {
                if(insumos[n]) return alert('Este insumo ya existe.');
                // Formato original y disponible parten iguales
                insumos[n]=[p, f, f]; 
            } else {
                // Si es reestock, mantenemos el stock actual que quedaba o lo reabastecemos por completo
                let stockExistente = insumos[n][2] !== undefined ? insumos[n][2] : insumos[n][1];
                // Al reabastecer, sumamos la nueva compra o reseteamos al tope original. Resetearemos al tope original + remanente por comodidad de bodega
                insumos[n]=[p, f, f]; 
            }
            
            document.getElementById('stockNuevoNombre').value='';
            sincronizar(); 
            alert('¡Bodega centralizada y actualizada con éxito! 🛒✨');
            document.querySelectorAll('input[name="stockM"]')[0].checked = true;
            altStock();
        }

        // RESPALDOS DE SEGURIDAD TOTAL
        function exportarRespaldo() {
            const datos = { insumos, recetas };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datos));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "respaldo_pasteleria_master.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarRespaldo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.insumos && parsed.recetas) {
                        insumos = parsed.insumos;
                        recetas = parsed.recetas;
                        sincronizar();
                        alert('¡Copia de seguridad subida y restaurada con éxito! 📂✨');
                    } else { alert('Formato de archivo inválido.'); }
                } catch (err) { alert('Error al procesar el archivo de respaldo.'); }
            };
            reader.readAsText(file);
        }

        poblarS(); renderListas(); nextId(); if(document.getElementById('stockSelectInsumo').value) cStock();
    </script>
</body>
</html>
